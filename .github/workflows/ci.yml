name: Trophy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          VERSION=$(python3 packaging/ci_version.py --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" --pr "$PR_NUMBER" --sha "$GITHUB_SHA")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-sdk
      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu24-sdk-ccache
          restore-keys: ubuntu24-sdk-ccache
          max-size: 2G
          save-always: true
      - name: Restore GTest
        id: cache-gtest
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/gtest_install
          key: ubuntu24-gtest-6.12.0-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: ubuntu24-gtest-6.12.0-
      - name: Prepare GTest if not cached
        if: steps.cache-gtest.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/google/googletest.git gtest_src
          cmake -GNinja -S gtest_src -B gtest_build -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/gtest_install"
          cmake --build gtest_build --target install
      - name: Configure and build
        run: |
          cmake -B build -GNinja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DAPP_VERSION="$VERSION" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/gtest_install" \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          desktop-file-validate packaging/trophy.desktop
          appstreamcli validate --no-net build/io.github.stevenjwheeler.Trophy.metainfo.xml
      - name: Preserve build for tests and AppImage (no rebuild)
        run: |
          # Tar preserves modes, symlinks and generated paths. All consumers
          # use the same runner OS, SDK and checkout path as this job.
          tar -I 'zstd -T2 -3' -cf "$RUNNER_TEMP/trophy-sdk-build.tar.zst" build
      - uses: actions/upload-artifact@v4
        with:
          name: Trophy-sdk-build-${{ github.sha }}
          path: ${{ runner.temp }}/trophy-sdk-build.tar.zst
          compression-level: 0
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-sdk
      - uses: actions/download-artifact@v4
        with:
          name: Trophy-sdk-build-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-build
      - name: Restore built binaries
        run: tar -I zstd -xf "$RUNNER_TEMP/sdk-build/trophy-sdk-build.tar.zst"
      - name: Start headless PipeWire
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/trophy-test-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          for i in $(seq 1 50); do
            [[ ! -S "$XDG_RUNTIME_DIR/pipewire-0" ]] || break
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/pipewire-0"
      - name: Run unit and integration tests
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/trophy-test-config
          XDG_RUNTIME_DIR: ${{ runner.temp }}/trophy-test-runtime
          TMPDIR: ${{ runner.temp }}/trophy-test-tmp
          QT_QPA_PLATFORM: offscreen
          QT_AUDIO_BACKEND: alsa
        run: |
          mkdir -p "$XDG_CONFIG_HOME" "$TMPDIR"
          ctest --test-dir build --output-on-failure --timeout 300 \
            --output-junit "$RUNNER_TEMP/trophy-tests.xml"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trophy-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/trophy-tests.xml
            ${{ runner.temp }}/pipewire.log
          retention-days: 7

  package-appimage:
    needs: [build, test]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.build.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-sdk
      - uses: actions/download-artifact@v4
        with:
          name: Trophy-sdk-build-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-build
      - name: Restore build
        run: tar -I zstd -xf "$RUNNER_TEMP/sdk-build/trophy-sdk-build.tar.zst"
      - name: Generate and smoke-test AppImage
        run: |
          set -euo pipefail
          export LINUXDEPLOY_OUTPUT_VERSION="$VERSION"
          wget --tries=3 --waitretry=5 -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget --tries=3 --waitretry=5 -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          DESTDIR=AppDir cmake --install build
          TROPHY_LIB=$(find AppDir/usr -name libTrophy.so -print -quit)
          TROPHY_BIN=$(find AppDir/usr -name trophy -type f -print -quit)
          test -n "$TROPHY_LIB" && test -n "$TROPHY_BIN"
          export QMAKE=$(command -v qmake6 || command -v qmake)
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib:${LD_LIBRARY_PATH:-}"
          export QML_SOURCES_PATHS="$PWD/build/qml"
          export EXTRA_QT_MODULES='quickcontrols2;multimedia;waylandcompositor'
          QT_PLUGINS=$("$QMAKE" -query QT_INSTALL_PLUGINS)
          WAYLAND_PLUGINS=("$QT_PLUGINS"/platforms/libqwayland*.so)
          test -f "${WAYLAND_PLUGINS[0]}"
          EXTRA_PLATFORM_PLUGINS=libqoffscreen.so
          for plugin in "${WAYLAND_PLUGINS[@]}"; do
            EXTRA_PLATFORM_PLUGINS+=";$(basename "$plugin")"
          done
          export EXTRA_PLATFORM_PLUGINS
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable "$TROPHY_BIN" --library "$TROPHY_LIB" \
            --exclude-library 'libva.so*' --exclude-library 'libva-drm.so*' \
            --exclude-library 'libva-x11.so*' --exclude-library 'libvdpau.so*' \
            --exclude-library 'libvulkan.so*' --exclude-library 'libOpenCL.so*' \
            --exclude-library 'libvpl.so*' --exclude-library 'libcuda*.so*' \
            --exclude-library 'libnvidia-*.so*' \
            --desktop-file packaging/trophy.desktop --icon-file resources/icons/trophy.svg --plugin qt
          rm AppDir/AppRun
          install -m755 packaging/AppRun AppDir/AppRun
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --exclude-library 'libva.so*' --exclude-library 'libva-drm.so*' \
            --exclude-library 'libva-x11.so*' --exclude-library 'libvdpau.so*' \
            --exclude-library 'libvulkan.so*' --exclude-library 'libOpenCL.so*' \
            --exclude-library 'libvpl.so*' --exclude-library 'libcuda*.so*' \
            --exclude-library 'libnvidia-*.so*' --output appimage
          images=(Trophy*.AppImage)
          test "${#images[@]}" -eq 1
          chmod +x "${images[0]}"
          # Refuse to ship an AppImage that bundles host driver/interface libs.
          if (rm -rf /tmp/_verify_sq && mkdir -p /tmp/_verify_sq && cd /tmp/_verify_sq && APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/${images[0]}" --appimage-extract >/dev/null 2>&1); then
            bad=$(find /tmp/_verify_sq/squashfs-root -type f \( -name 'libva.so*' -o -name 'libva-drm.so*' -o -name 'libva-x11.so*' -o -name 'libvdpau.so*' -o -name 'libvulkan.so*' -o -name 'libOpenCL.so*' -o -name 'libvpl.so*' -o -name 'libcuda*.so*' -o -name 'libnvidia-*.so*' -o -name '*_drv_video.so' -o -name '*_dri.so' \) | head)
            if [[ -n "$bad" ]]; then echo "ERROR: bundled host driver/interface libs found:"; echo "$bad"; exit 1; fi
            rm -rf /tmp/_verify_sq
          fi
          python3 packaging/check_appimage_abi.py "${images[0]}" --report "$RUNNER_TEMP/trophy-appimage-abi.json"
          python3 packaging/smoke_appimage.py "${images[0]}" --log "$RUNNER_TEMP/trophy-appimage-smoke.log"
          TARGET="Trophy-${VERSION}-x86_64.AppImage"
          if [[ "${images[0]}" != "$TARGET" ]]; then mv "${images[0]}" "$TARGET"; fi
          sha256sum "$TARGET" > SHA256SUMS.appimage
      - name: Smoke exact AppImage on clean Ubuntu 24.04 runtime
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/appimage-baseline-runtime"
          mkdir -p "$evidence"
          docker build -t trophy-appimage-runtime24:ci - < packaging/containers/appimage-runtime.Dockerfile
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$evidence,dst=/evidence" \
            trophy-appimage-runtime24:ci python3 /source/packaging/smoke_appimage.py \
            "/source/Trophy-${VERSION}-x86_64.AppImage" --log /evidence/startup.log
      - name: Upload AppImage immediately
        uses: actions/upload-artifact@v4
        with:
          name: Trophy-${{ env.VERSION }}-package-appimage
          path: |
            Trophy-*-x86_64.AppImage
            SHA256SUMS.appimage
          compression-level: 0
          retention-days: 14
      - name: Upload AppImage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trophy-appimage-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trophy-appimage-smoke.log
            ${{ runner.temp }}/trophy-appimage-abi.json
            ${{ runner.temp }}/appimage-baseline-runtime/*
          if-no-files-found: ignore
          retention-days: 7

  package-native:
    needs: [build, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ubuntu
            kind: deb
          - profile: fedora
            kind: rpm
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PROFILE: ${{ matrix.profile }}
      KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Refresh dependency layers weekly
        id: dependency-cache
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Reuse distro-native dependency image layers
        uses: docker/build-push-action@v6
        with:
          context: packaging/containers
          file: packaging/containers/${{ matrix.profile }}.Dockerfile
          load: true
          tags: trophy-native-${{ matrix.profile }}:ci
          build-args: DEPENDENCY_REFRESH=${{ steps.dependency-cache.outputs.week }}
          cache-from: type=gha,scope=trophy-native-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=trophy-native-${{ matrix.profile }}
      - name: Reuse clean runtime image layers
        uses: docker/build-push-action@v6
        with:
          context: packaging/containers
          file: packaging/containers/${{ matrix.profile }}-runtime.Dockerfile
          load: true
          tags: trophy-runtime-${{ matrix.profile }}:ci
          build-args: DEPENDENCY_REFRESH=${{ steps.dependency-cache.outputs.week }}
          cache-from: type=gha,scope=trophy-runtime-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=trophy-runtime-${{ matrix.profile }}
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trophy-native-${{ matrix.profile }}/ccache
          key: native-ccache-${{ matrix.profile }}-${{ hashFiles('packaging/containers/*.Dockerfile') }}-${{ github.sha }}
          restore-keys: native-ccache-${{ matrix.profile }}-${{ hashFiles('packaging/containers/*.Dockerfile') }}-
      - name: Build, smoke-test and check package-manager lifecycle
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/trophy-native-$PROFILE"
          mkdir -p "$work/runtime" "$GITHUB_WORKSPACE/dist"
          # No SDK: each package links against its target distro's Qt/FFmpeg.
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env "VERSION=$VERSION" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$work,dst=/work" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/dist,dst=/dist" \
            "trophy-native-$PROFILE:ci" bash /source/packaging/containers/build.sh "$KIND" \
            > "$work/build.log" 2>&1
          packages=("$work/ci-packages"/*."$KIND")
          upgrades=("$work/ci-upgrade"/*."$KIND")
          test "${#packages[@]}" -eq 1 && test "${#upgrades[@]}" -eq 1
          docker run --rm --env TROPHY_PACKAGE_TEST_CONTAINER=1 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$work,dst=/artifacts,readonly" \
            --mount "type=bind,src=$work/runtime,dst=/evidence" \
            "trophy-runtime-$PROFILE:ci" python3 /source/packaging/test_native_install.py \
            "/artifacts/ci-packages/$(basename "${packages[0]}")" \
            --upgrade "/artifacts/ci-upgrade/$(basename "${upgrades[0]}")" --logs /evidence
          sha256sum dist/* > "SHA256SUMS.$PROFILE"
      - name: Upload native packages immediately
        uses: actions/upload-artifact@v4
        with:
          name: Trophy-${{ env.VERSION }}-package-${{ matrix.profile }}
          path: |
            dist/*
            SHA256SUMS.${{ matrix.profile }}
          compression-level: 0
          retention-days: 14
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trophy-${{ matrix.profile }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trophy-native-${{ matrix.profile }}/build.log
            ${{ runner.temp }}/trophy-native-${{ matrix.profile }}/*startup.log
            ${{ runner.temp }}/trophy-native-${{ matrix.profile }}/runtime/*.log
            ${{ runner.temp }}/trophy-native-${{ matrix.profile }}/runtime/*.json
          if-no-files-found: ignore
          retention-days: 7

  verify-packages:
    needs: [build, test, package-appimage, package-native, reporters-multilib]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Trophy-${{ env.VERSION }}-package-*
          merge-multiple: true
      - name: Check complete set and generate combined checksums
        run: |
          set -euo pipefail
          test -f "Trophy-${VERSION}-x86_64.AppImage"
          test -f "dist/Trophy-${VERSION}.tar.xz"
          test -f "dist/Trophy-${VERSION}-amd64.deb"
          test -f "dist/Trophy-${VERSION}-x86_64.rpm"
          sha256sum --check SHA256SUMS.appimage
          sha256sum --check SHA256SUMS.ubuntu
          sha256sum --check SHA256SUMS.fedora
          sha256sum Trophy-*-x86_64.AppImage dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Trophy-${{ env.VERSION }}-checksums
          path: SHA256SUMS
          retention-days: 14

  reporters-multilib:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bits: [32, 64]
    steps:
      - uses: actions/checkout@v4
      - name: Install reporter build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++-multilib libvulkan-dev libgtest-dev
      - name: Build architecture-matched reporter fixtures
        env:
          BITS: ${{ matrix.bits }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$BITS" == 32 ]]; then
            cmake -S /usr/src/googletest -B "$RUNNER_TEMP/gtest32-build" -GNinja \
              -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DBUILD_GMOCK=OFF \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/gtest32"
            cmake --build "$RUNNER_TEMP/gtest32-build" --parallel 2
            cmake --install "$RUNNER_TEMP/gtest32-build"
            options+=("-DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/reporters/i686-linux.cmake"
                      "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/gtest32")
          fi
          cmake -S reporters -B "$RUNNER_TEMP/reporters$BITS" -GNinja \
            -DCMAKE_BUILD_TYPE=Release "${options[@]}"
          cmake --build "$RUNNER_TEMP/reporters$BITS" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/reporters$BITS" --output-on-failure \
            --timeout 60 --output-junit "$RUNNER_TEMP/reporters$BITS.xml"
      - name: Check reporter ABI and disabled host runtime loading
        env:
          BITS: ${{ matrix.bits }}
        run: |
          python3 packaging/check_reporter_runtimes.py \
            "$RUNNER_TEMP/reporters$BITS/libtrophy_layer.so" \
            "$RUNNER_TEMP/reporters$BITS/libtrophy_gl_shim.so" \
            --execute-trusted-fixtures --require-host-pass \
            --output "$RUNNER_TEMP/reporters$BITS-runtime.json"
      - name: Upload reporter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trophy-reporters-${{ matrix.bits }}-diagnostics
          path: |
            ${{ runner.temp }}/reporters${{ matrix.bits }}.xml
            ${{ runner.temp }}/reporters${{ matrix.bits }}-runtime.json
            ${{ runner.temp }}/reporters${{ matrix.bits }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    needs: [build, verify-packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize automatic tag creation and draft updates.
    concurrency:
      group: trophy-release-draft
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for release ancestry check
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: Trophy-${{ env.VERSION }}-package-*
          path: release-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: Trophy-${{ env.VERSION }}-checksums
          path: release-input
      - name: Draft a newer main release (never publish)
        run: |
          python3 packaging/draft_release.py --repo "$GITHUB_REPOSITORY" \
            --version-file VERSION --sha "$GITHUB_SHA" --assets release-input

  comment-pr:
    needs: verify-packages
    if: github.event_name == 'pull_request' && needs.verify-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post build link
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number,
              body: `### Build ready\n\n[Download verified packages](${url})`
            });
