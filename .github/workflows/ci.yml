name: Trophy CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      APPIMAGE_EXTRACT_AND_RUN: 1
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync version from Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Get tag name (removes the 'v' prefix)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          # Matches "VERSION" followed by any combination of numbers and dots
          sed -i "s/VERSION [0-9]\+\.[0-9]\+\.[0-9]\+/VERSION $TAG_VERSION/" CMakeLists.txt
          echo "Syncing CMake version to $TAG_VERSION"

      - name: Install System Dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: |
            build-essential cmake ninja-build ccache xvfb libfuse2t64
            libgl1-mesa-dev libx11-dev libxext-dev libxkbcommon-dev 
            libwayland-dev libxcb-shm0-dev libva-dev libavcodec-dev 
            libavformat-dev libswscale-dev libgtest-dev wget
            libxcb-cursor0 libxkbcommon-x11-0
          version: 1.3
      
      - name: Prepare GTest
        run: |
          cmake -GNinja -S /usr/src/googletest -B gtest_build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/gtest_install
          cmake --build gtest_build --target install

      - name: Prepare Qt 6.10.2
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.10.2'
          modules: 'qtmultimedia'

      - name: Configure & Build
        run: |
          cmake -B build -GNinja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/gtest_install \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Run Unit Tests
        run: cd build && ctest --output-on-failure

      - name: Generate AppImage
        shell: bash
        run: |
          # 1. Download tools
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          # 2. Install to AppDir
          DESTDIR=AppDir cmake --install build
          mkdir -p AppDir/usr/lib
          cp build/libTrophy.so AppDir/usr/lib/

          # 3. Enhanced Environment for Qt Plugin
          export QMAKE=$(which qmake6 || which qmake)
          export LD_LIBRARY_PATH=$PWD/AppDir/usr/lib:$LD_LIBRARY_PATH
          
          # Force scan of your QML directory to find "import QtQuick.Controls"
          export QML_SOURCES_PATHS=$PWD/qml
          
          # Manually specify modules that linuxdeploy often misses in Qt 6
          export EXTRA_QT_MODULES="quickcontrols2;multimedia"
          
          # Ensure wayland and xcb platforms are both included for CachyOS/Arch compatibility
          export EXTRA_QT_PLUGINS="wayland-graphics-integration-helper;wayland-shell-integration"

          # 4. Run linuxdeploy
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/trophy \
            --library AppDir/usr/lib/libTrophy.so \
            --desktop-file packaging/trophy.desktop \
            --icon-file resources/icons/trophy.svg \
            --deploy-deps-only AppDir/usr/lib/libTrophy.so \
            --plugin qt \
            --output appimage

          # 5. Versioning & Rename
          RAW_VERSION=$(grep -m 1 "VERSION" CMakeLists.txt | grep -oP '\d+\.\d+\.\d+' || echo "0.0.0")
          VERSION=${RAW_VERSION:-0.0.0}
          echo "Using version: $VERSION"
          
          APPIMAGE_FILE=$(ls Trophy_*.AppImage | head -n 1)
          if [ -f "$APPIMAGE_FILE" ]; then
            mv "$APPIMAGE_FILE" "Trophy-${VERSION}-x86_64.AppImage"
          else
            echo "Warning: Could not find generated AppImage to rename"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trophy-AppImage-x86_64
          path: Trophy-*-x86_64.AppImage

  create-release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Trophy-AppImage-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Trophy-*-x86_64.AppImage
          generate_release_notes: true
