name: Trophy CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      APPIMAGE_EXTRACT_AND_RUN: 1
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync version from Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Get tag name (removes the 'v' prefix)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          # Matches "VERSION" followed by any combination of numbers and dots
          sed -i "s/VERSION [0-9]\+\.[0-9]\+\.[0-9]\+/VERSION $TAG_VERSION/" CMakeLists.txt
          echo "Syncing CMake version to $TAG_VERSION"

      - name: Install System Dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: |
            build-essential
            cmake
            ninja-build
            ccache
            xvfb
            libfuse2t64
            wget
            libgl1-mesa-dev
            libx11-dev
            libxext-dev
            libxkbcommon-dev
            libwayland-dev
            libxcb-shm0-dev
            libxcb-cursor0
            libxkbcommon-x11-0
            libvulkan-dev
            libpipewire-0.3-dev
            libspa-0.2-dev
            libdrm-dev
            libavcodec-dev
            libavformat-dev
            libavutil-dev
            libswscale-dev
            libswresample-dev
            libva-dev
            libva-drm2
            libgtest-dev
          version: 1.4
          
      - name: Restore build files from cache if exists
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Restore GTest from cache if exists
        id: cache-gtest
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/gtest_install
          key: ${{ runner.os }}-gtest-6.10.2-${{ hashFiles('**/CMakeLists.txt') }} 
          restore-keys: |
            ${{ runner.os }}-gtest-

      - name: Prepare GTest if not cached
        if: steps.cache-gtest.outputs.cache-hit != 'true'
        run: |
          cmake -GNinja -S /usr/src/googletest -B gtest_build -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/gtest_install
          cmake --build gtest_build --target install

      - name: Prepare Qt 6.10.2 or use from cache
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.10.2'
          modules: 'qtmultimedia'
          cache: 'true'

      - name: Configure & Build
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git rev-parse --short HEAD)
          fi

          cmake -B build -GNinja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DAPP_VERSION=$VERSION \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/gtest_install \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      #- name: Run Unit Tests
      #  run: cd build && ctest --output-on-failure

      - name: Generate AppImage
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git rev-parse --short HEAD)
          fi
          
          export VERSION=$VERSION
          export LINUXDEPLOY_OUTPUT_VERSION=$VERSION
          echo "Building Trophy version: $VERSION"

          # 2. Download tools
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          # 3. Install to AppDir
          DESTDIR=AppDir cmake --install build
          mkdir -p AppDir/usr/lib
          cp build/libTrophy.so AppDir/usr/lib/ || true

          # 4. Environment setup
          export QMAKE=$(which qmake6 || which qmake)
          export LD_LIBRARY_PATH=$PWD/AppDir/usr/lib:$LD_LIBRARY_PATH
          export QML_SOURCES_PATHS=$PWD/qml
          export EXTRA_QT_MODULES="quickcontrols2;multimedia"
          
          # 5. Run linuxdeploy
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/trophy \
            --library AppDir/usr/lib/libTrophy.so \
            --desktop-file packaging/trophy.desktop \
            --icon-file resources/icons/trophy.svg \
            --plugin qt \
            --output appimage

          # 6. SMOKE TEST
          echo "Running smoke test..."
          GENERATED_FILE=$(ls Trophy*.AppImage | head -n 1)
          chmod +x "$GENERATED_FILE"
          
          # Setup minimal environment
          export XDG_RUNTIME_DIR=/tmp/runtime-ci
          mkdir -p $XDG_RUNTIME_DIR
          
          # Use offscreen to bypass the "No X11 support" check
          QT_QPA_PLATFORM=offscreen ./"$GENERATED_FILE" & 
          
          APP_PID=$!
          sleep 5
          if ps -p $APP_PID > /dev/null; then
             echo "App launched successfully (Headless mode)!"
             kill $APP_PID
          else
             echo "App crashed! Check if Wayland-only checks are blocking CI."
             exit 1
          fi

          # 7. Rename based on the exported VERSION
          # linuxdeploy usually names it Trophy-$VERSION-x86_64.AppImage or Trophy-x86_64.AppImage
          # We force a consistent name here:
          GENERATED_FILE=$(ls Trophy*.AppImage | head -n 1)
          mv "$GENERATED_FILE" "Trophy-${VERSION}-x86_64.AppImage"

      - name: Generate Checksum
        run: |
          # Generate SHA256 for any AppImage in the directory
          sha256sum Trophy-*-x86_64.AppImage > SHA256SUMS
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trophy-AppImage-x86_64
          path: |
            Trophy-*-x86_64.AppImage
            SHA256SUMS
          
  create-release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Trophy-AppImage-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Trophy-*-x86_64.AppImage
            SHA256SUMS
          generate_release_notes: true

  comment-pr:
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post AppImage Link
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const artifactsUrl = `https://github.com/${owner}/${repo}/actions/runs/${run_id}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: owner,
              repo: repo,
              body: `### 🚀 Build Ready!\n\nA new **AppImage** has been generated for this PR. You can download it from the artifacts section here:\n\n[📦 Download Trophy AppImage](${artifactsUrl})`
            })
