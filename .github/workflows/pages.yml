name: Deploy Trophy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages only publishes a deployment whose ref is the default branch.
    # This workflow used to deploy straight from the `release` event, whose ref is
    # the release tag: deploy-pages reported success, but the live site kept the
    # previous build. Release runs now re-dispatch this workflow on `main` instead.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::GitHub Pages only publishes deployments run from refs/heads/$DEFAULT_BRANCH; this run is $GITHUB_REF. Deploying anyway would report success without updating the site."
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Resolve latest release downloads
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { data: release } = await github.rest.repos.getLatestRelease(context.repo);
            const patterns = {
              appimage: /^Trophy-.*-x86_64\.AppImage$/,
              deb: /^Trophy-.*-amd64\.deb$/,
              rpm: /^Trophy-.*-x86_64\.rpm$/,
              archive: /^Trophy-.*\.tar\.xz$/,
              checksums: /^SHA256SUMS$/,
            };
            const downloads = {};
            for (const [key, pattern] of Object.entries(patterns)) {
              const asset = release.assets.find(a => a.state === 'uploaded' && pattern.test(a.name));
              if (!asset) throw new Error(`Latest release is missing ${key}; keeping the previous site deployment.`);
              const url = new URL(asset.browser_download_url);
              if (url.protocol !== 'https:' || url.hostname !== 'github.com') {
                throw new Error(`Unexpected asset host for ${key}`);
              }
              downloads[key] = url.href.replaceAll('&', '&amp;').replaceAll('"', '&quot;');
            }
            const page = fs.readFileSync('website/index.html', 'utf8');
            let updated = 0;
            let rendered = page.replace(/<a\b[^>]*\bdata-release-asset="([^"]+)"[^>]*>/g, (tag, key) => {
              if (!downloads[key]) throw new Error(`Unknown download key: ${key}`);
              updated++;
              return tag.replace(/href="[^"]*"/, `href="${downloads[key]}"`);
            });
            if (updated !== 6) throw new Error(`Expected six download links, found ${updated}`);
            const escapeHtml = value => value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
            const notes = new URL(release.html_url);
            if (notes.protocol !== 'https:' || notes.hostname !== 'github.com') throw new Error('Unexpected release notes host');
            let versions = 0;
            rendered = rendered.replace(/(<strong\b[^>]*\bdata-release-version\b[^>]*>)[^<]*(<\/strong>)/g, (_, start, end) => {
              versions++;
              return start + escapeHtml(release.tag_name) + end;
            });
            let notesLinks = 0;
            rendered = rendered.replace(/<a\b[^>]*\bdata-release-notes\b[^>]*>/g, tag => {
              notesLinks++;
              return tag.replace(/href="[^"]*"/, `href="${escapeHtml(notes.href)}"`);
            });
            if (versions !== 1 || notesLinks !== 1) throw new Error('Expected one release version and one release-notes link');
            fs.writeFileSync('website/index.html', rendered);
            core.info(`Resolved ${updated} download links from ${release.tag_name}`);
      - name: Render documentation pages
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install --quiet --disable-pip-version-check "markdown==3.11.2" "pygments==2.21.0"
          "$RUNNER_TEMP/docs-venv/bin/python" website/build_docs.py
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A published release changes the version and download links baked into the
  # site, but the release event's ref is the tag, which GitHub Pages will not
  # publish. Re-run the deployment on the default branch instead.
  redeploy-on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Redeploy from the default branch
        uses: actions/github-script@v7
        with:
          script: |
            const defaultBranch = context.payload.repository.default_branch;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: defaultBranch,
            });
            core.info(`Requested a ${defaultBranch} deployment for ${context.payload.release.tag_name}`);
